name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release binary
        shell: powershell
        run: .\scripts\build.ps1

      - name: Verify artifact size
        shell: powershell
        run: |
          $exe = Get-Item .\dist\GDocsDrop-Windows.exe
          if ($exe.Length -lt 20480) {
            throw "Unexpected small binary size: $($exe.Length)"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/GDocsDrop-Windows.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
